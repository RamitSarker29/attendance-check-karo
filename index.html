<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Attendance Check karo — Check your attendance efficiently</title>
    <meta name="description" content="Track your college routine, calculate attendance requirements in real time, plan bunk days safely, and simulate leaves." />
    <meta name="theme-color" content="#090d16" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('ack_theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
